# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 200
    lr: 1e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  operator:
    name: nonlinear_blur
    opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 85
    lr: 1.20e-5
    tau: 0.01
    lr_min_ratio: 0.012
    momentum: 0.46
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: nonlinear_blur
    opt_yml_path: forward_operator/bkse/options/generate_blur/default.yml
    sigma: 0.05
