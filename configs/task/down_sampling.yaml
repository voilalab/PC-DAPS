# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 1e-4
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  operator:
    name: down_sampling
    resolution: 256
    scale_factor: 4
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 12
    lr: 1.04e-4
    tau: 0.01
    lr_min_ratio: 0.012
    momentum: 0.90
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: down_sampling
    resolution: 256
    scale_factor: 4
    sigma: 0.05
