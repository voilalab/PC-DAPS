# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 5e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  operator:
    name: phase_retrieval
    oversample: 2.0
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 62
    lr: 9.75e-6
    tau: 0.01
    lr_min_ratio: 0.019
    momentum: 0.73
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: phase_retrieval
    oversample: 2.0
    sigma: 0.05
