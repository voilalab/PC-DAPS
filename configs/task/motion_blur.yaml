# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 5e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian
  
  operator:
    name: motion_blur
    kernel_size: 61
    intensity: 0.5
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 96
    lr: 3.69e-5
    tau: 0.01
    lr_min_ratio: 0.01
    momentum: 0.11
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: motion_blur
    kernel_size: 61
    intensity: 0.5
    sigma: 0.05
