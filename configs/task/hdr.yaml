# pixel space task
pixel:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 2e-5
    tau: 0.01
    lr_min_ratio: 0.01
    mc_algo: langevin
    prior_solver: gaussian

  pcdaps_config:
    skip_final_langevin: False 
    mixture_center: ode        

  operator:
    name: high_dynamic_range
    scale: 2
    sigma: 0.05

# pixel space task with hmc
pixel_hmc:
  mcmc_sampler_config:  
    num_steps: 100
    lr: 2.18e-5
    tau: 0.01
    lr_min_ratio: 0.013
    momentum: 0.23
    mc_algo: hmc
    prior_solver: gaussian
  
  operator:
    name: high_dynamic_range
    scale: 2
    sigma: 0.05
